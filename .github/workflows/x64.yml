name: x64 Linux

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-20.04

    name: >-
      ubuntu-20.04

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Print gcc version
        run: |
          gcc -v

      - name: Build
        run: |
          mkdir build
          cd build
          cmake ..
          cmake --build
      
      - name: Tests
        run: |
          cd build
          ctest

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-20.04
          retention-days: 1
          path: |
            ./build/*
